<style>
/* Farben 1:1 von der bisherigen Suna-Seite, hell/dunkel nach Systemeinstellung */
:root{
  --bg:#efe3c8; --paper:#fbf5e8; --paper-2:#f3e4c3; --label:#efd8ab;
  --ink:#3a2618; --ink-soft:#75583b;
  --band:#3e2a1c; --band-ink:#efd6a6;
  --clay:#ab4f26; --clay-ink:#fff7ec;
  --line:#c9a672; --focus:#1d6e78; --danger:#a3321f;
  --shadow:0 1px 0 rgba(62,42,28,.06),0 10px 28px -16px rgba(62,42,28,.45);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16100b; --paper:#231912; --paper-2:#2b1f15; --label:#33251a;
    --ink:#f1e0c3; --ink-soft:#b89a75;
    --band:#0e0906; --band-ink:#e8c58e;
    --clay:#a9491f; --clay-ink:#fff1df;
    --line:#4a3524; --focus:#63b8c2; --danger:#ec8a6c;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf wie bisher: dunkles Band mit Wappen, darunter Lehm-Leiste */
.banner-top{background:var(--band);background:radial-gradient(120% 160% at 50% 0%,color-mix(in srgb,var(--band) 78%,var(--clay)) 0%,var(--band) 62%);color:var(--band-ink)}
.banner-inner{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,34px);padding-block:clamp(8px,1.4vw,14px)}
.banner-inner img{height:clamp(32px,4.5vw,48px);width:auto;flex:none}
.banner-title{text-align:center;min-width:0}
.kicker{display:block;font-family:var(--f-display);font-weight:700;font-size:clamp(11px,1.5vw,13px);letter-spacing:.5em;padding-left:.5em;opacity:.72;margin-bottom:4px}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3.4vw,32px);letter-spacing:.08em;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.banner-sub{background:var(--clay);color:var(--clay-ink)}
.banner-sub .wrap{padding-block:7px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(13px,1.8vw,16px);letter-spacing:.04em;min-height:1.5em}

/* Bereich-Umschalter */
.tabs{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs-in{display:flex;align-items:stretch;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;font:inherit;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--ink-soft);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--clay)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tab svg{width:17px;height:17px;flex:none}
.tabs-rechts{margin-left:auto;display:flex;align-items:center;padding-left:8px}
.aussen{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;text-decoration:none;white-space:nowrap}
.aussen:hover{color:var(--ink);border-color:var(--clay)}
.aussen:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.aussen svg{width:14px;height:14px}

/* Inhalt: der gewaehlte Bereich fuellt den Rest der Seite */
main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding-block:8px 8px}
.rahmen{position:relative;flex:1;min-height:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.rahmen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.rahmen iframe[hidden]{display:none}
.laden{position:absolute;inset:0;display:grid;place-items:center;gap:10px;align-content:center;color:var(--ink-soft);font-size:14px;pointer-events:none}
.laden[hidden]{display:none}
.sand{width:34px;height:34px;border-radius:50%;border:3px solid var(--label);border-top-color:var(--clay);animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sand{animation:none}}
.hinweis{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:8px;padding:10px 14px;font-size:13.5px;box-shadow:var(--shadow)}
.hinweis[hidden]{display:none}
.hinweis a{color:var(--clay);font-weight:700}
footer{color:var(--ink-soft);font-size:12px;text-align:center;padding:0 0 6px}

@media (max-width:640px){
  .tab{flex:1 1 0;min-width:0;justify-content:center;padding:10px 2px 8px;font-size:11.5px;letter-spacing:.02em;gap:4px}
  .tab svg{display:none}
  .aussen{display:none}
  .aussen span{display:none}
  main{padding-block:10px 10px}
  .rahmen{border-radius:10px;min-height:0}
}
</style>
</head>

<script>
(function () {
  var ICONS = {
    schild: '<path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/>',
    rolle: '<path d="M7 4h11a2 2 0 0 1 2 2v1H9"/><path d="M9 7v11a2 2 0 0 1-4 0V6a2 2 0 0 1 2-2"/><path d="M9 18h10a2 2 0 0 0 2-2v-1H11"/><path d="M12 10h5M12 13h4"/>',
    liste: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
    stern: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>'
  };
  var liste = (window.SUNA_BEREICHE || []).filter(function (b) { return b && b.id && b.url && b.aktiv !== false; });
  var reiter = document.getElementById('reiter'), rahmen = document.getElementById('rahmen');
  var laden = document.getElementById('laden'), ladenText = document.getElementById('laden-text');
  var hinweis = document.getElementById('hinweis'), hinweisLink = document.getElementById('hinweis-link');
  var aussen = document.getElementById('aussen'), untertitel = document.getElementById('untertitel');
  var frames = {}, geladen = {}, uhr = null, aktuell = null;

  function merken(id) { try { localStorage.setItem('suna-zentrale:bereich', id); } catch (e) {} }
  function gemerkt() { try { return localStorage.getItem('suna-zentrale:bereich'); } catch (e) { return null; } }
  function finde(id) { for (var i = 0; i < liste.length; i++) if (liste[i].id === id) return liste[i]; return null; }

  liste.forEach(function (b) {
    var t = document.createElement('button');
    t.type = 'button'; t.className = 'tab'; t.setAttribute('role', 'tab'); t.id = 'reiter-' + b.id;
    t.setAttribute('aria-controls', 'rahmen'); t.dataset.id = b.id;
    t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[b.symbol] || ICONS.liste) + '</svg>';
    t.appendChild(document.createTextNode(b.titel));
    t.addEventListener('click', function () { zeige(b.id, true); });
    reiter.appendChild(t);
  });

  // Pfeiltasten im Umschalter
  reiter.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var i = liste.indexOf(finde(aktuell)), n = (i + (e.key === 'ArrowRight' ? 1 : -1) + liste.length) % liste.length;
    zeige(liste[n].id, true); document.getElementById('reiter-' + liste[n].id).focus(); e.preventDefault();
  });

  function zeige(id, vonKlick) {
    var b = finde(id) || liste[0]; if (!b) return;
    aktuell = b.id; merken(b.id);
    if (vonKlick && location.hash !== '#' + b.id) history.replaceState(null, '', '#' + b.id);
    Array.prototype.forEach.call(reiter.children, function (t) {
      var an = t.dataset.id === b.id; t.setAttribute('aria-selected', an ? 'true' : 'false'); t.tabIndex = an ? 0 : -1;
    });
    rahmen.setAttribute('aria-labelledby', 'reiter-' + b.id);
    untertitel.textContent = b.untertitel || b.titel;
    document.title = b.titel + ' · Sunagakure no Sato';
    var ohneE = b.url.replace(/([?&])e=1(&|$)/, function(m, v, n){ return n ? v : ''; }); aussen.href = ohneE; hinweisLink.href = ohneE;
    // Jeder Bereich wird nur einmal geladen und bleibt beim Umschalten erhalten (Anmeldung, Eingaben)
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== b.id; });
    erzeuge(b); frames[b.id].hidden = false;
    clearTimeout(uhr); hinweis.hidden = true;
    if (geladen[b.id]) fertig();
    else {
      laden.hidden = false; ladenText.textContent = b.titel + ' wird geladen …';
      // Google braucht beim ersten Aufruf manchmal etwas länger
      uhr = setTimeout(function () { if (!geladen[b.id] && aktuell === b.id) hinweis.hidden = false; }, 12000);
    }
  }
  // Bereich einmal laden (unsichtbar vorladen geht auch: dann ist das Umschalten sofort da)
  function erzeuge(b) {
    if (frames[b.id]) return;
    var f = document.createElement('iframe');
    f.title = b.titel; f.src = b.url; f.loading = 'eager'; f.hidden = b.id !== aktuell;
    f.setAttribute('allow', 'clipboard-read; clipboard-write');
    f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    f.addEventListener('load', function () { geladen[b.id] = true; if (aktuell === b.id) fertig(); });
    frames[b.id] = f; rahmen.insertBefore(f, laden);
  }
  function fertig() { laden.hidden = true; hinweis.hidden = true; clearTimeout(uhr); }

  // Eine Anmeldung für alle Bereiche: Grenzwache/Dienstblatt melden ihre Sitzung, die Ausbildung fragt sie ab (nur eigene Google-Rahmen)
  var sunaSitzung = null, abfrager = [];
  window.addEventListener('message', function (ev) {
    var host = ''; try { host = new URL(ev.origin).hostname; } catch (e) {}
    if (!/.googleusercontent.com$/.test(host)) return;
    var d = ev.data || {};
    if (d.typ === 'suna-sitzung') {
      sunaSitzung = d.sitzung || null;
      abfrager.forEach(function (q) { try { q.w.postMessage({ typ: 'suna-sitzung', sitzung: sunaSitzung }, q.o); } catch (e) {} });
    } else if (d.typ === 'suna-sitzung?') {
      if (!abfrager.some(function (q) { return q.w === ev.source; })) abfrager.push({ w: ev.source, o: ev.origin });
      if (sunaSitzung) try { ev.source.postMessage({ typ: 'suna-sitzung', sitzung: sunaSitzung }, ev.origin); } catch (e) {}
    }
  });
  window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (finde(id)) zeige(id, false); });
  var start = finde(location.hash.slice(1)) ? location.hash.slice(1) : (finde(gemerkt()) ? gemerkt() : (liste[0] && liste[0].id));
  if (start) { zeige(start, false); setTimeout(function () { liste.forEach(erzeuge); }, 2500); }
  else { laden.hidden = true; untertitel.textContent = 'Noch keine Bereiche eingetragen (bereiche.js).'; }
})();
</script>
